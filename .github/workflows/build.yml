name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      RUNTIME: win-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Publish and package
        id: package
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'src/BnetManager/BnetManager.csproj'
          $version = ([xml](Get-Content $project -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }
          $name = "BnetManager-$version-$env:RUNTIME"
          $output = Join-Path 'artifacts' $name
          dotnet publish $project -c Release -r $env:RUNTIME --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }

          @'
          MIT License

          Copyright (c) 2026 BnetManager contributors

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          '@ | Set-Content "$output/LICENSE.txt" -Encoding utf8

          $config = "src/BnetManager/bin/Release/net10.0-windows/$env:RUNTIME/BnetManager.runtimeconfig.json"
          $frameworks = (Get-Content $config -Raw | ConvertFrom-Json).runtimeOptions.includedFrameworks
          $runtimeVersion = ($frameworks | Where-Object name -EQ 'Microsoft.NETCore.App').version
          $desktopVersion = ($frameworks | Where-Object name -EQ 'Microsoft.WindowsDesktop.App').version
          $aspnetVersion = ($frameworks | Where-Object name -EQ 'Microsoft.AspNetCore.App').version
          if (-not $runtimeVersion -or -not $desktopVersion -or -not $aspnetVersion) { throw 'Runtime versions missing from build output' }
          $runtimePackage = "$env:NUGET_PACKAGES/microsoft.netcore.app.runtime.$env:RUNTIME/$runtimeVersion"
          $desktopPackage = "$env:NUGET_PACKAGES/microsoft.windowsdesktop.app.runtime.$env:RUNTIME/$desktopVersion"
          $aspnetPackage = "$env:NUGET_PACKAGES/microsoft.aspnetcore.app.runtime.$env:RUNTIME/$aspnetVersion"
          $notices = New-Item -ItemType Directory -Path "$output/licenses/dotnet"
          Copy-Item "$runtimePackage/LICENSE.TXT", "$runtimePackage/THIRD-PARTY-NOTICES.TXT" -Destination $notices
          Copy-Item "$desktopPackage/LICENSE" -Destination "$notices/WPF-LICENSE.TXT"
          Invoke-WebRequest "https://raw.githubusercontent.com/dotnet/wpf/v$desktopVersion/THIRD-PARTY-NOTICES.TXT" `
            -OutFile "$notices/WPF-THIRD-PARTY-NOTICES.TXT"
          Copy-Item "$aspnetPackage/LICENSE.txt" -Destination "$notices/ASPNETCORE-LICENSE.TXT"
          Copy-Item "$aspnetPackage/THIRD-PARTY-NOTICES.TXT" -Destination "$notices/ASPNETCORE-THIRD-PARTY-NOTICES.TXT"

          $sourceFiles = @{
            'https://github.com/modelcontextprotocol/csharp-sdk' = @('LICENSE', 'THIRD-PARTY-NOTICES.txt')
            'https://github.com/dotnet/extensions' = @('LICENSE', 'THIRD-PARTY-NOTICES.TXT')
            'https://github.com/dotnet/dotnet' = @('LICENSE.TXT')
          }
          $collected = @{}
          $deps = "src/BnetManager/bin/Release/net10.0-windows/$env:RUNTIME/BnetManager.deps.json"
          $libraries = (Get-Content $deps -Raw | ConvertFrom-Json).libraries.PSObject.Properties
          foreach ($dependency in ($libraries | Where-Object { $_.Value.type -eq 'package' })) {
            $id = $dependency.Name.Split('/')[0].ToLowerInvariant()
            $package = Join-Path $env:NUGET_PACKAGES $dependency.Value.path
            $metadata = ([xml](Get-Content "$package/$id.nuspec" -Raw)).package.metadata
            $repository = [string]$metadata.repository.url
            $commit = [string]$metadata.repository.commit
            if (-not $sourceFiles.ContainsKey($repository) -or $commit -notmatch '^[0-9a-f]{40}$') {
              throw "Unconfigured license source for $($dependency.Name)"
            }
            $key = "$repository/$commit"
            if (-not $collected.ContainsKey($key)) {
              $repositoryName = $repository.Substring('https://github.com/'.Length)
              $directory = New-Item -ItemType Directory -Path "$output/licenses/packages/$($repositoryName.Replace('/', '-'))-$commit"
              foreach ($file in $sourceFiles[$repository]) {
                Invoke-WebRequest "https://raw.githubusercontent.com/$repositoryName/$commit/$file" `
                  -OutFile "$directory/$file"
              }
              $collected[$key] = $directory
            }
            $directory = $collected[$key]
            "$($dependency.Name): $($metadata.copyright)" | Add-Content "$directory/COPYRIGHTS.TXT" -Encoding utf8
            foreach ($file in (Get-ChildItem $package -File | Where-Object { $_.Name -match '^(LICENSE|NOTICE|THIRD-PARTY-NOTICES)(\..*)?$' })) {
              Copy-Item $file.FullName -Destination "$directory/$id-$($file.Name)"
            }
          }

          Compress-Archive -Path "$output/*" -DestinationPath "artifacts/$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.name }}
          path: artifacts/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: BnetManager-*-win-x64
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n\n%s\n' \
            'Windows 战网多账号切换工具，提供国服、亚服、美服和欧服登录入口。' \
            '适用于 Windows 11 x64（AMD64）。' \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" artifacts/*-win-x64.zip --verify-tag \
            --title "BnetManager $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
